<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>GRYD</title>
        <link rel="stylesheet" href="css/styles.css">
        <link rel="stylesheet" href="css/auth.css">
        <link rel="stylesheet" href="css/games_container.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <script src="js/auth.js" defer></script>
        <script src="js/games.js" defer></script>
        <script src="js/game_state.js" defer></script>
    </head>

    <body>


        <header>
            <h1 class="logo">
                <a href="/index.html">GRYD</a>
            </h1>

            <nav class="main-nav">
                <button type="button" id="explore">
                    <i class="bi bi-compass"></i>
                    <span>Explore</span>
                </button>
                <button type="button" id="library">
                    <i class="bi bi-collection"></i>
                    <span>Library</span>
                </button>
            </nav>

            <div id="session">
                <button type="button" id="show-login">Login</button>
                <button type="button" id="show-register">Register</button>
            </div>

            <div id="user-avatar" style="display: none;">
                <button id="avatar-button" class="avatar"></button>
                <div id="avatar-menu" class="avatar-menu">
                    <span id="user-email" class="user-email"></span>
                    <a href="#">Profile</a>
                    <a href="#">Library</a>
                    <button id="logout">Logout</button>
                </div>
            </div>
        </header>


        <main>
            <!-- Home -->
            <section id="home">
                <h2>Welcome to GRYD</h2>
            </section>

            <!-- Login -->
            <section id="login-section" style="display: none;">
                <h2>Login</h2>

                <form id="login-form">
                    <input type="email" id="login-email" placeholder="Email" required>
                    <input type="password" id="login-password" placeholder="Password" required>
                    <button type="submit">Login</button>
                    <span id="login-error"></span>
                </form>
            </section>

            <!-- Register -->
            <section id="register-section" style="display: none;">
                <h2>Create Account</h2>

                <form id="register-form">
                    <input type="email" id="register-email" placeholder="Email" required>
                    <input type="password" id="register-password1" placeholder="Password" required>
                    <input type="password" id="register-password2" placeholder="Repeat password" required>
                    <button type="submit">Create</button>
                    <span id="register-error"></span>
                </form>
            </section>
            <section id="games-container" style="display: none;"></section>
            <section id="scroll-sentinel"></section>
        </main>


    <footer>
        <p>&copy; 2026 GRYD</p>

        <small class="footer-credit">
            Video game data provided by IGDB
        </small>

        <nav aria-label="Legal">
            <a href="/privacy.html">Privacy Policy</a>
            <a href="/terms.html">Terms of Service</a>
        </nav>
    </footer>


    </body>

</html>
